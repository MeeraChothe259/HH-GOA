<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hacker House Goa 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,600&family=Baloo+2:wght@600;700;800&family=Noto+Sans+Devanagari:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --green:#1a5230;
      --green-3:#0f3d20;
      --mustard:#F1C63B;
      --mustard-soft:#F5D876;
      --pink:#E8218C;
      --pink-2:#FF63B0;
      --cream:#FBF3D9;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}

    body{
      font-family:'IBM Plex Mono',monospace;
      background:#1a5230 url('landing-bg.png') center/cover no-repeat fixed;
      color:var(--cream);
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* ── NAV ── */
    nav{
      display:flex;align-items:center;justify-content:space-between;
      padding:24px 40px;position:relative;z-index:10;
    }
    .logo{
      font-family:'Baloo 2',sans-serif;font-weight:800;
      color:var(--mustard);font-size:22px;line-height:1;
    }
    .logo .pm{font-size:12px;vertical-align:super;}
    .logo .sub{display:block;font-size:10px;letter-spacing:0.16em;font-weight:700;}
    .nav-btns{display:flex;gap:12px;align-items:center;}
    .btn-ghost{
      background:transparent;border:1.5px dashed var(--mustard);
      color:var(--mustard);font-family:'IBM Plex Mono',monospace;
      font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;
      padding:10px 22px;border-radius:6px;cursor:pointer;
      transition:all 0.2s;
    }
    .btn-ghost:hover{background:rgba(241,198,59,0.12);border-style:solid;}
    .btn-solid{
      background:var(--mustard);border:2px dashed var(--green-3);
      color:var(--green-3);font-family:'Baloo 2',sans-serif;
      font-size:15px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;
      padding:10px 30px;border-radius:6px;cursor:pointer;
      box-shadow:0 4px 0 rgba(0,0,0,0.25);
      transition:transform 0.2s,box-shadow 0.2s;
    }
    .btn-solid:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,0.2);}
    .btn-solid:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,0.3);}

    /* ── HERO ── */
    .hero{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      text-align:center;padding:0 24px;
      position:relative;z-index:5;
    }
    .hero-title{
      font-family:'Fraunces',serif;font-weight:900;
      font-size:clamp(64px,14vw,200px);line-height:0.88;
      color:var(--mustard);letter-spacing:-0.03em;
      text-shadow:0 8px 0 rgba(0,0,0,0.18);
    }
    .hero-title .line2{display:block;}
    .goa-sticker{
      display:inline-block;vertical-align:middle;
      background:var(--pink);color:var(--mustard);
      font-family:'Noto Sans Devanagari',sans-serif;font-weight:900;
      font-size:clamp(30px,5vw,72px);
      padding:4px 20px 10px;border-radius:14px;
      border:3px solid var(--mustard);
      box-shadow:0 6px 0 rgba(0,0,0,0.25);
      transform:rotate(-4deg);
      animation:wiggle 3s ease-in-out infinite;
      margin:0 10px;
    }
    @keyframes wiggle{
      0%,100%{transform:rotate(-4deg) translateY(0);}
      50%{transform:rotate(1deg) translateY(-5px);}
    }

    .doodle-box{
      position:absolute; top:-10px; right:-50px;
      font-size:clamp(24px, 4vw, 50px);
      background:var(--cream);
      border:3px solid var(--green-3);
      border-radius:40% 60% 70% 30% / 40% 50% 60% 50%; /* hand-drawn irregular shape */
      width:clamp(50px, 7vw, 90px);
      height:clamp(50px, 7vw, 90px);
      display:flex; align-items:center; justify-content:center;
      box-shadow:4px 4px 0 rgba(0,0,0,0.2);
      transform:rotate(15deg);
      transition:transform 0.1s ease-out, border-radius 0.3s;
      z-index: 10;
      animation: shapeShift 2s infinite alternate;
    }
    @keyframes shapeShift {
      0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
      100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    }

    .hero-info{
      margin-top:28px;
      font-size:clamp(11px,1.4vw,14px);letter-spacing:0.2em;text-transform:uppercase;
      color:var(--mustard);opacity:0.9;
    }
    .hero-info span{margin:0 8px;}

    /* ── CTA ── */
    .cta-wrap{
      margin-top:40px;display:flex;flex-direction:column;align-items:center;gap:14px;
    }
    .cta-btn{
      position:relative;overflow:hidden;
      background:var(--mustard);color:var(--green-3);border:none;
      font-family:'Baloo 2',sans-serif;font-weight:800;
      font-size:clamp(18px,2.5vw,24px);letter-spacing:0.06em;
      padding:18px 64px;border-radius:999px;cursor:pointer;
      box-shadow:0 8px 0 rgba(0,0,0,0.25),0 16px 40px rgba(241,198,59,0.3);
      transition:transform 0.2s,box-shadow 0.2s;
      animation:pulse 2.2s ease-in-out infinite;
    }
    .cta-btn:hover{transform:translateY(-3px);box-shadow:0 12px 0 rgba(0,0,0,0.2),0 24px 50px rgba(241,198,59,0.4);}
    .cta-btn:active{transform:translateY(2px);}
    .cta-btn::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.3) 50%,transparent 70%);
      transform:translateX(-100%);transition:transform 0.5s;
    }
    .cta-btn:hover::after{transform:translateX(100%);}
    @keyframes pulse{
      0%,100%{box-shadow:0 8px 0 rgba(0,0,0,0.25),0 16px 40px rgba(241,198,59,0.3);}
      50%{box-shadow:0 8px 0 rgba(0,0,0,0.25),0 22px 60px rgba(241,198,59,0.55);}
    }
    .cta-sub{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--mustard-soft);opacity:0.6;}

    /* ── FOOTER ── */
    footer{
      display:flex;justify-content:space-between;align-items:flex-end;
      padding:20px 40px 24px;position:relative;z-index:10;flex-wrap:wrap;gap:16px;
    }
    .socials{display:flex;flex-direction:column;gap:8px;}
    .socials a{
      display:inline-flex;align-items:center;gap:10px;
      color:var(--mustard);text-decoration:none;font-size:12px;letter-spacing:0.08em;
      transition:color 0.2s;
    }
    .socials a:hover{color:var(--cream);}
    .socials a svg{flex-shrink:0;}
    .footer-right{text-align:right;display:flex;flex-direction:column;gap:6px;}
    .footer-right a{
      color:var(--mustard);text-decoration:none;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
      transition:color 0.2s;
    }
    .footer-right a:hover{color:var(--cream);}
    .copy{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--mustard);opacity:0.5;margin-top:4px;}

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroPop {
      0% { opacity: 0; transform: translateY(60px) scale(0.8) rotateX(20deg); text-shadow: 0 0 0 rgba(0,0,0,0); }
      60% { opacity: 1; transform: translateY(-10px) scale(1.05) rotateX(-5deg); text-shadow: 0 20px 10px rgba(0,0,0,0.3); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); text-shadow: 0 8px 0 rgba(0,0,0,0.18); }
    }
    @keyframes heroFloat {
      0%, 100% { transform: translateY(0); text-shadow: 0 8px 0 rgba(0,0,0,0.18); }
      50% { transform: translateY(-12px); text-shadow: 0 24px 12px rgba(0,0,0,0.25), 0 0 40px rgba(241,198,59,0.2); }
    }

    nav { animation: fadeDown 0.8s ease-out forwards; }
    .hero-title { opacity: 0; perspective: 1000px; transform-style: preserve-3d; animation: heroPop 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards, heroFloat 5s ease-in-out 1.3s infinite; }
    .hero-info { opacity: 0; animation: fadeUp 0.8s ease-out 0.4s forwards; }
    .cta-wrap { opacity: 0; animation: fadeUp 0.8s ease-out 0.6s forwards; }
    footer { opacity: 0; animation: fadeUp 0.8s ease-out 0.8s forwards; }

    /* ── RESPONSIVE ── */
    @media(max-width:640px){
      nav{padding:16px 20px;}
      footer{padding:16px 20px 20px;}
      .btn-ghost{display:none;}
    }
  </style>
</head>
<body>


  <!-- NAV -->
  <nav>
    <div class="logo">2:47<span class="pm">PM</span><span class="sub">STUDIO</span></div>
    <div class="nav-btns">
      <button class="btn-solid" id="applyBtn">Apply</button>
    </div>
  </nav>

  <!-- HERO -->
  <main class="hero">
    <h1 class="hero-title" style="position:relative; display:inline-block;">
      HACKER<span class="goa-sticker">गोवा</span>HOUSE
      <div id="dynamicDoodle" class="doodle-box">⚡</div>
    </h1>

    <p class="hero-info">
      GOA, INDIA<span>·</span>28 – 31 OCT 2026<span>·</span>2:47 PM STUDIO
    </p>

    <div class="cta-wrap">
      <button class="cta-btn" id="ctaBtn">🌴 Create Your Pass</button>
      <span class="cta-sub">PFP Frame & Builder ID Generator</span>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="socials">
      <a href="#">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        @247PMSTUDIO
      </a>
      <a href="#">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        @TWOFOURTYSEVENPM
      </a>
      <a href="#">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        SATAPATHYPRAYASU@GMAIL.COM
      </a>
    </div>
    <div class="footer-right">
      <a href="#">BRAND KIT</a>
      <a href="#">TERM & CONDITIONS</a>
      <div class="copy">© 2026 HH-GOA. ALL RIGHTS RESERVED.</div>
    </div>
  </footer>

  <script>
    function goToPass(){
      setTimeout(()=>{
        window.location.href = encodeURI('hhgoa-frame-generator (1).html');
      }, 100);
    }
    document.getElementById('ctaBtn').addEventListener('click', goToPass);
    document.getElementById('applyBtn').addEventListener('click', goToPass);

    // Continuous Doodle Animation
    const doodles = ['⚡', '🌴', '🌺', '🥥', '💻', '✨', '🌊', '😎', '🎵', '🚀', '🔥', '🍹'];
    const doodleEl = document.getElementById('dynamicDoodle');
    let dIdx = 0;
    setInterval(() => {
      doodleEl.innerText = doodles[dIdx];
      dIdx = (dIdx + 1) % doodles.length;
      // random wobble effect
      const rot = Math.floor(Math.random() * 50) - 25; // -25 to +25 deg
      const scale = 1 + (Math.random() * 0.2); // 1.0 to 1.2
      doodleEl.style.transform = `rotate(${rot}deg) scale(${scale})`;
      
      // randomize background color occasionally for a messy marker feel
      const colors = ['var(--cream)', 'var(--mustard-soft)', 'var(--pink-2)', '#98FB98', '#87CEFA'];
      if(Math.random() > 0.5) {
        doodleEl.style.background = colors[Math.floor(Math.random() * colors.length)];
      }
    }, 350);
  </script>
</body>
</html>
